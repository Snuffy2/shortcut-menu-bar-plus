name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish to the marketplaces
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create or update the release pull request
        if: github.event_name == 'push'
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate the release tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the vMAJOR.MINOR.PATCH format." >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Checkout the released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name || inputs.release_tag }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the extension version
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          test "$(node -p 'require("./package.json").version')" = "${RELEASE_TAG#v}"

      - name: Package extension
        id: package_extension
        run: |
          set -euo pipefail
          VSIX_PATH="shortcut-menu-bar-plus-$(node -p 'require("./package.json").version').vsix"
          npx --no-install vsce package --out "$VSIX_PATH"
          echo "vsix_path=$VSIX_PATH" >> "$GITHUB_OUTPUT"

      - name: Publish to VSCode Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --no-install vsce publish --packagePath "${{ steps.package_extension.outputs.vsix_path }}"

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
        run: npx --no-install ovsx publish "${{ steps.package_extension.outputs.vsix_path }}"
