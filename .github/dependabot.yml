version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      development-dependencies:
        dependency-type: "development"
    ignore:
      # typescript-eslint 8 currently declares support through TypeScript 6.
      - dependency-name: "typescript"
        versions:
          - ">=7.0.0"
      # Keep @types/vscode on the minimum engines.vscode minor; vsce package
      # rejects types newer than the declared engine. Patch updates still flow.
      - dependency-name: "@types/vscode"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
